<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lean Bulk, Training & RingConn Dashboard - Marco</title>
    <!-- Chart.js, PapaParse (CSV Parser) & Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-blue: #38bdf8;
            --accent-green: #4ade80;
            --accent-teal: #2dd4bf;
            --accent-orange: #fb923c;
            --accent-yellow: #facc15;
            --accent-pink: #ec4899;
            --accent-purple: #c084fc;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .header { text-align: center; margin-bottom: 25px; }
        .header h1 { margin: 0; font-size: 2rem; color: var(--accent-blue); }
        .header p { color: #94a3b8; margin-top: 5px; }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 15px 20px;
            border-radius: 12px;
            border: 1px solid #334155;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }
        .toolbar-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .btn-action {
            background: #0f172a;
            border: 1px solid #334155;
            color: #94a3b8;
            padding: 10px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.2s ease;
        }
        .btn-action:hover {
            background: var(--accent-blue);
            color: #0f172a;
            border-color: var(--accent-blue);
        }
        .btn-import {
            background: var(--accent-green) !important;
            color: #0f172a !important;
            font-weight: bold;
        }
        .btn-ringconn {
            background: var(--accent-pink) !important;
            color: #ffffff !important;
            font-weight: bold;
        }

        /* Stili Form Inserimento RingConn Nascosta */
        .form-card {
            display: none; /* Inizialmente nascosta */
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--accent-pink);
            margin-bottom: 35px;
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .form-group label {
            font-size: 0.8rem;
            color: #94a3b8;
            text-transform: uppercase;
        }
        .form-group input {
            background: #0f172a;
            border: 1px solid #334155;
            color: #f8fafc;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.9rem;
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--accent-pink);
        }
        .btn-submit {
            background: var(--accent-pink);
            color: #ffffff;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            transition: background 0.2s;
        }
        .btn-submit:hover {
            background: #db2777;
        }

        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }
        .kpi-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #334155;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .kpi-title { font-size: 0.8rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.05em; }
        .kpi-value { font-size: 1.6rem; font-weight: bold; margin-top: 5px; }
        .kpi-date { font-size: 0.75rem; color: #64748b; margin-top: 4px; }

        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));
            gap: 20px;
            margin-bottom: 35px;
        }
        .chart-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #334155;
        }

        .section-title {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--accent-teal);
            margin-bottom: 15px;
        }
        .table-container {
            background: var(--card-bg);
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 20px;
            overflow-x: auto;
            max-height: 440px;
            margin-bottom: 35px;
        }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.9rem; }
        th { background-color: #0f172a; color: var(--accent-blue); padding: 12px 14px; position: sticky; top: 0; }
        td { padding: 10px 14px; border-bottom: 1px solid #334155; color: #cbd5e1; }
    </style>
</head>
<body>

    <div class="header">
        <h1>📊 Lean Bulk, Training & RingConn Dashboard</h1>
        <p>Infrastruttura Cloud Supabase con Sincronizzazione Dinamica</p>
    </div>

    <div class="toolbar">
        <div>
            <span style="color: #94a3b8; font-size: 0.9rem;">Sincronizzazione Dati:</span>
            <strong style="color: var(--accent-green); margin-left: 5px;">Attiva (Cloud DB)</strong>
        </div>
        <div class="toolbar-actions">
            <!-- Pulsante Importazione Solo Hevy e BIA -->
            <input type="file" id="csvFileInput" accept=".csv" style="display: none;" onchange="handleCSVImport(event)">
            <button class="btn-action btn-import" onclick="document.getElementById('csvFileInput').click()">
                📁 Importa CSV (Hevy / BIA)
            </button>
            
            <!-- Pulsante Mostra/Nascondi Form RingConn -->
            <button class="btn-action btn-ringconn" onclick="toggleRingConnForm()">
                ➕ Inserisci RingConn
            </button>
            
            <button class="btn-action" onclick="loadDashboardData()">🔄 Aggiorna</button>
        </div>
    </div>

    <!-- Form di Inserimento Manuale RingConn (Nascosta/Mostrata dinamicamente) -->
    <div class="form-card" id="ringconnFormCard">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <div class="section-title" style="color: var(--accent-pink); margin-bottom: 0;">💍 Inserimento Report Settimanale RingConn</div>
            <button onclick="toggleRingConnForm()" style="background: none; border: none; color: #94a3b8; cursor: pointer; font-size: 1.2rem;">✖</button>
        </div>
        <p style="color: #94a3b8; font-size: 0.85rem; margin-top: 5px;">Compila i dati del report PDF generato dall'app per aggiornare il database.</p>
        
        <form id="ringconnForm" onsubmit="handleRingConnSubmit(event)">
            <div class="form-grid">
                <div class="form-group">
                    <label>Etichetta Settimana</label>
                    <input type="text" id="rc_label" placeholder="es. 21/09-27/09" required>
                </div>
                <div
